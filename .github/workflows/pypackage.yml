name: Build and (optionally)

on:
  push:
  workflow_dispatch:

env:
  PACKAGE_NAME: amdb
  MODULE_NAME: amdb
  PYTHON_VERSION: "3.11"
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: v1.12.6

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Clean dist
        run: rm -rf dist && mkdir -p dist

      - name: Build sdist
        uses: PyO3/maturin-action@v1.50.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: sdist
          path: dist
          compression-level: 0
          if-no-files-found: error

  build-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: 2_34
          - target: i686-unknown-linux-gnu
            manylinux: 2_34
          - target: aarch64-unknown-linux-gnu
            manylinux: 2_34
          - target: armv7-unknown-linux-gnueabihf
            manylinux: 2_34
          - target: powerpc64le-unknown-linux-gnu
            manylinux: 2_34
          - target: s390x-unknown-linux-gnu
            manylinux: 2_34
          - target: riscv64gc-unknown-linux-gnu
            manylinux: 2_34
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
          - target: i686-unknown-linux-musl
            manylinux: musllinux_1_2
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Clean dist
        run: rm -rf dist && mkdir -p dist

      - name: Build wheel
        uses: PyO3/maturin-action@v1.50.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist
          compression-level: 0
          if-no-files-found: error

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-sdist
      - build-wheels
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Download all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lah dist || true

      - name: Smoke test (linux x86_64 wheel)
        run: |
          uv pip install --system --no-index --find-links dist "${PACKAGE_NAME}" --force-reinstall
          ${MODULE_NAME} --help
          python -m ${MODULE_NAME} --help

      - name: Upload combined dist artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: dist
          path: dist
          compression-level: 0
          if-no-files-found: error
